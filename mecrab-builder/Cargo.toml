[package]
name = "mecrab-builder"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
readme = "README.md"
description = "Semantic dictionary builder for MeCrab - Wikidata/Wikipedia pipeline"
keywords = ["nlp", "wikidata", "dictionary", "japanese", "pipeline"]
categories = ["command-line-utilities", "text-processing"]

[dependencies]
# Core library (for Token, SemanticEntry definitions)
# The `parallel` feature is activated here so that the lattice parallel-vs-sequential
# integration test in tests/lattice_parallel.rs can exercise both code paths.
mecrab = { path = "../mecrab", features = ["parallel"] }

# Binary serialization (LE integers for sys.dic, matrix.bin, char.bin output)
byteorder.workspace = true

# Async runtime
tokio.workspace = true

# HTTP client for Wikidata API
reqwest.workspace = true

# Async utilities
futures.workspace = true

# Compression (gzip streaming) — Pure Rust via OxiARC
oxiarc-deflate.workspace = true

# Serialization
serde.workspace = true
serde_json.workspace = true

# CSV parsing
csv.workspace = true

# Progress bars
indicatif.workspace = true

# Parallel processing
rayon.workspace = true

# URL encoding (for Wikidata API queries)
urlencoding.workspace = true

# Error handling
thiserror.workspace = true

[lib]
name = "mecrab_builder"
path = "src/lib.rs"
