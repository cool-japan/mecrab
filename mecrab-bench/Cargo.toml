# MeCrab Benchmark Suite
# Copyright 2026 COOLJAPAN OU (Team KitaSan)
#
# Separate subcrate for benchmarks to keep core mecrab crate pure Rust
# without heavy dev-dependencies like criterion.

[package]
name = "mecrab-bench"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Benchmark suite for MeCrab morphological analyzer"
publish = false

[dependencies]
mecrab = { path = "../mecrab", features = ["simd"] }
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
criterion.workspace = true

[[bench]]
name = "parsing"
harness = false

[[bench]]
name = "viterbi"
harness = false

[[bench]]
name = "dictionary"
harness = false

[[bench]]
name = "simd"
harness = false

[[bench]]
name = "rerank"
harness = false

[[bench]]
name = "latticeprob"
harness = false

[[bench]]
name = "formats"
harness = false
